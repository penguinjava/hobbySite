services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${API_HOST}:${API_PORT}
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    volumes:
      - ./web:/web
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: api
    restart: unless-stopped
    environment:
      PORT: ${API_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      MEMBER_CODE: ${MEMBER_CODE}
      ADMIN_CODE: ${ADMIN_CODE}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE}
      MONGO_LOG_COLLECTION: ${MONGO_LOG_COLLECTION}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DB: ${MONGO_DB}
      TZ: Asia/seoul
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./api:/api